# Project-wide Gradle settings.
# Note: Settings configured in Android Studio's Gradle settings will override this file.

# JVM arguments for the Gradle daemon (4 GB max heap + Parallel GC for faster build throughput)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m

# JVM arguments for the Kotlin compiler daemon (3 GB max heap prevents Compose/KSP GC stalls)
kotlin.daemon.jvmargs=-Xmx3072m -XX:+UseParallelGC

# AndroidX & Kotlin
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Performance & Caching
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.tooling.parallel=true

# Keep configuration-cache false unless all plugins in your project explicitly support it
org.gradle.configuration-cache=false